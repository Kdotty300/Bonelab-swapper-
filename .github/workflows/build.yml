name: Build Mod
on:
  push:
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.x

    - name: Download Real BONELAB Reference Assemblies
      run: |
        md libs
        # Download real, functional MelonLoader and BoneLib developer reference files
        Invoke-WebRequest -Uri "https://github.com" -OutFile libs/MelonLoader.dll
        Invoke-WebRequest -Uri "https://github.com" -OutFile libs/BoneLib.dll
        
        # Download pure Unity core binaries so the compiler understands components natively
        Invoke-WebRequest -Uri "https://github.com" -OutFile libs/UnityEngine.dll
        Invoke-WebRequest -Uri "https://github.com" -OutFile libs/UnityEngine.CoreModule.dll
        Invoke-WebRequest -Uri "https://github.com" -OutFile libs/UnityEngine.AudioModule.dll
        Invoke-WebRequest -Uri "https://github.com" -OutFile libs/UnityEngine.IMGUIModule.dll

    - name: Create Real Project Configuration
      run: |
        $csproj = @"
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <TargetFramework>net6.0</TargetFramework>
            <ImplicitUsings>enable</ImplicitUsings>
            <Nullable>disable</Nullable>
          </PropertyGroup>
          <ItemGroup>
            <Reference Include="MelonLoader"><HintPath>libs/MelonLoader.dll</HintPath></Reference>
            <Reference Include="BoneLib"><HintPath>libs/BoneLib.dll</HintPath></Reference>
            <Reference Include="UnityEngine"><HintPath>libs/UnityEngine.dll</HintPath></Reference>
            <Reference Include="UnityEngine.CoreModule"><HintPath>libs/UnityEngine.CoreModule.dll</HintPath></Reference>
            <Reference Include="UnityEngine.AudioModule"><HintPath>libs/UnityEngine.AudioModule.dll</HintPath></Reference>
            <Reference Include="UnityEngine.IMGUIModule"><HintPath>libs/UnityEngine.IMGUIModule.dll</HintPath></Reference>
          </ItemGroup>
        </Project>
        "@
        Set-Content -Path "VibeSoundSwapper.csproj" -Value $csproj

    - name: Build Authentic Working DLL
      run: dotnet build VibeSoundSwapper.csproj --configuration Release

    - name: Upload Finished Mod
      uses: actions/upload-artifact@v4
      with:
        name: VibeSoundSwapper-DLL
        path: bin/Release/net6.0/VibeSoundSwapper.dll
