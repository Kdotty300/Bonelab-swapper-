name: Build Mod
on:
  push:
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.x

    - name: Auto-Generate Mod Glue Code
      run: |
        $glue = @"
        using System;
        namespace MelonLoader {
            public class MelonMod {
                public virtual void OnInitializeMelon() {}
                public virtual void OnUpdate() {}
            }
            [AttributeUsage(AttributeTargets.Assembly)]
            public class MelonInfoAttribute : Attribute {
                public MelonInfoAttribute(Type t, string n, string v, string a) {}
            }
            [AttributeUsage(AttributeTargets.Assembly)]
            public class MelonGameAttribute : Attribute {
                public MelonGameAttribute(string d, string g) {}
            }
        }
        "@
        Set-Content -Path "MelonGlue.cs" -Value $glue

    - name: Create Base Project Configuration
      run: |
        $csproj = @"
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <TargetFramework>net6.0</TargetFramework>
            <ImplicitUsings>enable</ImplicitUsings>
            <Nullable>disable</Nullable>
          </PropertyGroup>
        </Project>
        "@
        Set-Content -Path "VibeSoundSwapper.csproj" -Value $csproj

    - name: Compile Library
      run: dotnet build VibeSoundSwapper.csproj --configuration Release

    - name: Upload Mod Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VibeSoundSwapper-DLL
        path: bin/Release/net6.0/VibeSoundSwapper.dll
