name: Build Mod
on:
  push:
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.x

    - name: Fetch BoneLib and MelonLoader Stubs
      run: |
        md libs
        # Download public reference assemblies for MelonLoader and BoneLib
        Invoke-WebRequest -Uri "https://github.com" -OutFile libs/BoneLib.dll
        Invoke-WebRequest -Uri "https://github.com" -OutFile libs/MelonLoader.dll
        # Note: If compilation requires standard Unity structures, we reference them via the SDK targets

    - name: Create Project Configuration
      run: |
        $csproj = @"
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <TargetFramework>net6.0</TargetFramework>
            <ImplicitUsings>enable</ImplicitUsings>
            <Nullable>disable</Nullable>
          </PropertyGroup>
          <ItemGroup>
            <Reference Include="MelonLoader">
              <HintPath>libs/MelonLoader.dll</HintPath>
            </Reference>
            <Reference Include="BoneLib">
              <HintPath>libs/BoneLib.dll</HintPath>
            </Reference>
          </ItemGroup>
        </Project>
        "@
        Set-Content -Path "VibeSoundSwapper.csproj" -Value $csproj

    - name: Build Authentic DLL
      run: dotnet build VibeSoundSwapper.csproj --configuration Release

    - name: Upload Finished Mod
      uses: actions/upload-artifact@v4
      with:
        name: VibeSoundSwapper-DLL
        path: bin/Release/net6.0/VibeSoundSwapper.dll
